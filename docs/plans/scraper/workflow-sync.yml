# Copy this file to .github/workflows/sync.yml in the PRIVATE fidelity-sync repo.
#
# Manual trigger only (workflow_dispatch) — you press "Run workflow" in the GitHub
# app when you want an update. No schedule until you opt in.
#
# Runs on a SELF-HOSTED runner (your Windows laptop). GitHub-hosted runners use
# datacenter IPs that Fidelity blocks ("Sorry, we can't complete this action").
# A self-hosted runner uses your home/residential IP, which Fidelity accepts.
#
# IMPORTANT: the runner must be started INTERACTIVELY (run `run.cmd` while logged
# into the laptop), NOT installed as a Windows Service. A service runs in a
# non-interactive session with no desktop, and the headed browser needs a display.

name: Fidelity sync

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: '0 22 * * 1-5'   # weekdays ~22:00 UTC (after US close). Opt-in later.

permissions:
  contents: read

jobs:
  sync:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        # No --with-deps: that flag only installs OS packages on Ubuntu/Debian.
        run: npx playwright install chromium

      - name: Run sync
        env:
          FIDELITY_USER: ${{ secrets.FIDELITY_USER }}
          FIDELITY_PASS: ${{ secrets.FIDELITY_PASS }}
          FIDELITY_TOTP_SECRET: ${{ secrets.FIDELITY_TOTP_SECRET }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          INGEST_URL: https://aa-findocs.vercel.app/api/ingest-fidelity
        # Headed browser using the laptop's real desktop session.
        run: npm run sync

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: fidelity-*.png
          if-no-files-found: ignore
