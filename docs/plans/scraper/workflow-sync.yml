# Copy this file to .github/workflows/sync.yml in the PRIVATE fidelity-sync repo.
#
# Manual trigger only (workflow_dispatch) — you press "Run workflow" in the GitHub
# app when you want an update. No schedule until you opt in. To enable a daily run
# later, uncomment the `schedule` block.

name: Fidelity sync

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: '0 22 * * 1-5'   # weekdays ~22:00 UTC (after US close). Opt-in later.

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Diag
        run: |
          echo "neutro:"; curl -sSL -m 30 -o /dev/null -w "%{http_code} %{time_total}s -> %{url_effective}\n" https://example.com
          echo "fidelity (segue redirect, UA real):"
          curl -sSL -m 30 -o /dev/null \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36" \
            -w "%{http_code} %{time_total}s -> %{url_effective}\n" \
            https://digital.fidelity.com/prgw/digital/login/full-page || echo "curl falhou/timeout"

      - name: Run sync
        env:
          FIDELITY_USER: ${{ secrets.FIDELITY_USER }}
          FIDELITY_PASS: ${{ secrets.FIDELITY_PASS }}
          FIDELITY_TOTP_SECRET: ${{ secrets.FIDELITY_TOTP_SECRET }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          INGEST_URL: https://aa-findocs.vercel.app/api/ingest-fidelity
        # Headed browser under a virtual display to defeat headless detection.
        run: xvfb-run -a npm run sync

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: /tmp/fidelity-*.png
          if-no-files-found: ignore
